name: Deploy React to Instance

on:
  push:
    branches:
      - main

# Every run swaps the same staging and live folders on the instance, so two runs
# at once can move each other's files away. A running deploy always finishes; a
# newer push replaces any run still waiting, so only the latest one deploys next.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: GCP-APPLE

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # 배포 워크플로는 CI와 독립적으로 트리거되므로, 깨진 커밋이
      # 그대로 배포되지 않도록 여기서도 lint/test를 통과시킨다.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build React App
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.unblind.kr
          VITE_POST_EDITOR_ENABLED: 'true'
          VITE_GA_MEASUREMENT_ID: G-MR8ZZZV7BP

      # 기존 사이트를 지우기 전에 새 빌드를 스테이징 디렉토리에 먼저 올리고,
      # 마지막에 디렉토리 교체로 반영한다 (다운타임 최소화, 업로드 실패 시 기존 사이트 유지).
      - name: Prepare Staging Directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.INSTANCE_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            sudo rm -rf /var/www/react-app-staging
            sudo mkdir -p /var/www/react-app-staging
            sudo chown -R $USER:$USER /var/www/react-app-staging
            sudo chmod -R 755 /var/www/react-app-staging

      - name: Upload Build Files to Staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.INSTANCE_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'build/*'
          target: '/var/www/react-app-staging/'

      - name: Activate New Release
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.INSTANCE_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            sudo rm -rf /var/www/react-app-previous
            if [ -d /var/www/react-app ]; then
              sudo mv /var/www/react-app /var/www/react-app-previous
            fi
            sudo mv /var/www/react-app-staging /var/www/react-app
            sudo systemctl reload nginx
            echo "✅ Deployment complete!"
